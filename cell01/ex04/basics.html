<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basics</title>
        <style>
            body {
                background-color: pink;
            }
            h1 {
                color: white;
                text-align: center;
                font-size: 60px;
            }
            .shops {
                text-align: center;
            }
            .shop {
                display: inline-block;
                margin: 20px;
            }
            .shop img {
                width: 300px;
            }
            hr {
                width: 100%;
            }
            .copyright {
                text-align: right;
                font-style: italic;
                font-family: monospace;
            }
        </style>
    </head>
    <body>
        <h1>Basics &amp; Shopping ?!</h1>
        <div class="shops">
            <div class="shop">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Amazon_logo.svg?width=400" alt="Amazon">
                <p><a href="https://www.amazon.com">https://www.amazon.com</a></p>
            </div>
            <div class="shop">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/EBay_logo.svg?width=400" alt="eBay">
                <p><a href="https://www.ebay.com">https://www.ebay.com</a></p>
            </div>
        </div>
        <hr>
        <p class="copyright">&copy; ssrasiso 2026</p>
    </body>
</html>
